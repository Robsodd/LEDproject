<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        /* 1. LAYOUT FIX: Use Flex on Body */
        body {
            background: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            /* Enable Flexbox */
            flex-direction: row-reverse;
            /* Controls on right, Stand on left */
            justify-content: center;
            /* Center the group */
            align-items: flex-start;
            /* Align to top */
            gap: 20px;
            height: 100vh;
            margin: 0;
        }

        .controls {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            /* Stack buttons vertically */
            gap: 15px;
            border: 1px solid #444;
            width: 250px;
            z-index: 1000;
            /* Keep controls above diffusers */
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background: #00ffee;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: #111;
            text-transform: uppercase;
        }

        .stop-btn {
            background: #ff4444 !important;
            color: white !important;
        }

        .stand {
            display: grid;
            grid-template-columns: repeat(4, 1cm);
            grid-gap: 5px; 
            padding-left: 10px;
            background: #000;
            border-radius: 5px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            height: 25cm; 
            width: fit-content;
        }

        .led { 
            width: 0.7cm;  /* The physical LED chip size */
            height: 0.7cm; 
            border-radius: 50%; 
            background: #333; 
            transition: background 0.05s linear; 
            flex-shrink: 0;
        }

        #col-0, #col-1, #col-2, #col-3 {
            display: flex;
            height: 100%;
            /* This distributes your 25 LEDs perfectly over the 25cm height */
            justify-content: space-around; 
            align-items: center;
        }

        #col-0, #col-2 { flex-direction: column-reverse; }
        #col-1, #col-3 { flex-direction: column; }

        /* 2. DIFFUSER FIX: Close button and Resize */
        .frosted-glass {
            position: absolute;
            background: rgba(255, 255, 255, 0.03); /* Keep it very transparent */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            
            /* Increase the blur for more spread */
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            
            /* This creates the 'spread' effect outside the diffuser */
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1), 
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            
            z-index: 10;
            resize: both; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .drag-handle {
            width: 100%;
            height: 25px;
            background: rgba(255, 255, 255, 0.2);
            cursor: move;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-shrink: 0;
        }

        .close-diffuser {
            position: absolute;
            top: 2px;
            right: 7px;
            color: #ff4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 20;
            /* Ensure it's clickable above the handle */
        }
    </style>
</head>

<body>
    <div class="controls">
        <button onclick="createDiffuser()" style="background: #ffa500;">+ Add Diffuser</button>

        <div style="display: flex; align-items: center; gap: 10px;">
            <label style="font-size: 10px;">AUTO-TRAIL</label>
            <input type="checkbox" id="trail-toggle" checked>
        </div>

        <div>
            <label style="font-size: 10px; display:block;">COLOR</label>
            <input type="color" id="color-picker" value="#00ffee">
        </div>

        <div>
            <label style="font-size: 10px; display:block;">SPEED</label>
            <input type="range" id="speed" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>

        <div class="btn-group" id="button-area"></div>
    </div>

    <div class="stand">
        <div id="col-0" class="strip-column"></div>
        <div id="col-1" class="strip-column"></div>
        <div id="col-2" class="strip-column"></div>
        <div id="col-3" class="strip-column"></div>
    </div>

    <script type="py" config="./pyscript.json">
        from pyscript import document
        import asyncio
        import LEDTower1 

        active_task = None
        use_background_fader = True

        async def tail_fader():
            while True:
                is_on = document.querySelector("#trail-toggle").checked
                if is_on and use_background_fader:
                    for i in range(100):
                        el = document.querySelector(f"#led-{i}")
                        if el and el.style.backgroundColor != "rgb(51, 51, 51)":
                            el.style.backgroundColor = "#333"
                            el.style.boxShadow = "none"
                await asyncio.sleep(0.05) 

        asyncio.create_task(tail_fader())

        for s_idx in range(4):
            col = document.querySelector(f"#col-{s_idx}")
            for i in range(s_idx*25, (s_idx*25)+25):
                led = document.createElement("div")
                led.className = "led"
                led.id = f"led-{i}"
                led.innerText = i
                col.appendChild(led)

        async def web_set_led(led_id, color):
            el = document.querySelector(f"#led-{led_id}")
            if el:
                el.style.transition = "none" 
                el.style.backgroundColor = color
                el.style.boxShadow = f"0 0 15px {color}"
                _ = el.offsetHeight 
                el.style.transition = "background 0.5s linear"

        async def web_set_led_multiple(led_ids, color, brightness=1.0):
            # Convert brightness (0.0 - 1.0) to a percentage for CSS
            bright_pct = brightness * 100
            
            # Create a 'dimmed' version of the color by mixing it with black
            # 100% brightness = pure color | 20% brightness = 20% color, 80% black
            display_color = f"color-mix(in srgb, {color} {bright_pct}%, black)"
            
            for lid in led_ids:
                el = document.querySelector(f"#led-{lid}")
                if el:
                    el.style.transition = "none" 
                    el.style.backgroundColor = display_color
                    
                    # We also dim the glow (box-shadow) to match
                    el.style.boxShadow = f"0 0 15px {display_color}"
                    
                    _ = el.offsetHeight 
                    el.style.transition = "background 0.5s linear, box-shadow 0.5s linear"

        async def start_effect(func_name):
            global active_task, use_background_fader
            use_background_fader = False if "glow" in func_name or "scanner" in func_name else True

            if active_task and not active_task.done():
                active_task.cancel()
                try: await active_task
                except: pass
            
            if func_name != "stop":
                color = document.querySelector("#color-picker").value
                speed = float(document.querySelector("#speed").value)
                effect_func = getattr(LEDTower1, func_name)
                active_task = asyncio.create_task(effect_func(web_set_led, web_set_led_multiple, color, speed))

        area = document.querySelector("#button-area")
        for name in LEDTower1.__all__:
            btn = document.createElement("button")
            btn.innerText = name.replace("_", " ")
            if name == "stop": btn.className = "stop-btn"
            
            def make_handler(n):
                async def h(e): await start_effect(n)
                return h
            
            btn.onclick = make_handler(name)
            area.appendChild(btn)
    </script>

    <script>
        function createDiffuser() {
            const d = document.createElement("div");
            d.className = "frosted-glass";
            d.style.left = "50px";
            d.style.top = "50px";
            d.style.width = "60px";
            d.style.height = "600px";

            // The close button is separate from the drag handle to ensure it works
            d.innerHTML = `
                <div class="drag-handle">DRAG</div>
                <div class="close-diffuser" onclick="this.parentElement.remove()">×</div>
            `;

            document.body.appendChild(d);
            makeDraggable(d);
        }

        function makeDraggable(el) {
            const handle = el.querySelector(".drag-handle");
            let isDragging = false;

            handle.onmousedown = (e) => {
                // Only drag if the handle is clicked, not the close button
                if (e.target.className === 'close-diffuser') return;

                isDragging = true;
                let startX = e.clientX - el.offsetLeft;
                let startY = e.clientY - el.offsetTop;

                document.onmousemove = (e) => {
                    if (!isDragging) return;
                    el.style.left = (e.clientX - startX) + "px";
                    el.style.top = (e.clientY - startY) + "px";
                };

                document.onmouseup = () => {
                    isDragging = false;
                    document.onmousemove = null;
                };
            };
        }

        window.onload = createDiffuser;
    </script>
</body>

</html>
